<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="640" viewBox="0 0 1200 640"
     role="img" aria-labelledby="title desc">
  <title id="title">Схема Deep Research Pipeline</title>
  <desc id="desc">
    Вопрос превращается в план и параллельные исследовательские задачи.
    Источники сохраняются как неизменяемые снимки и выводы. Независимые
    проверяющие оценивают выводы, после чего автор формирует отчёт для
    экспертной проверки и публикации.
  </desc>

  <rect width="1200" height="640" rx="24" fill="#0B0F14"/>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="60" y="46" dominant-baseline="hanging"
          fill="#F2F5F7" font-size="46" font-weight="740">
      Один вопрос. Полный путь доказательств.
    </text>
    <text x="60" y="106" dominant-baseline="hanging"
          fill="#8B98A5" font-size="22">
      Параллельно там, где важна скорость. Неизменно там, где важно доверие.
    </text>
  </g>

  <g fill="none" stroke="#45D6A8" stroke-width="3">
    <path d="M300 260H325"/>
    <path d="M580 260H605"/>
    <path d="M860 260H885"/>
    <path d="M1020 340V385"/>
    <path d="M900 480H875"/>
    <path d="M620 480H595"/>
  </g>
  <g fill="#45D6A8">
    <path d="M325 251L340 260L325 269Z"/>
    <path d="M605 251L620 260L605 269Z"/>
    <path d="M885 251L900 260L885 269Z"/>
    <path d="M1011 385L1020 400L1029 385Z"/>
    <path d="M875 471L860 480L875 489Z"/>
    <path d="M595 471L580 480L595 489Z"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g transform="translate(60 180)">
      <rect width="240" height="160" rx="14" fill="#111A21"
            stroke="#2A3944" stroke-width="2"/>
      <text x="22" y="20" dominant-baseline="hanging"
            fill="#45D6A8" font-size="18" font-weight="700">
        01 / ПОСТАНОВКА
      </text>
      <text x="22" y="72" dominant-baseline="hanging"
            fill="#F2F5F7" font-size="28" font-weight="680">
        Планировщик
      </text>
      <text x="22" y="124" dominant-baseline="hanging"
            fill="#8B98A5" font-size="18">вопрос → задачи</text>
    </g>

    <g transform="translate(340 180)">
      <rect width="240" height="160" rx="14" fill="#111A21"
            stroke="#2A3944" stroke-width="2"/>
      <text x="22" y="20" dominant-baseline="hanging"
            fill="#45D6A8" font-size="18" font-weight="700">02 / ПОИСК</text>
      <text x="22" y="55" dominant-baseline="hanging"
            fill="#F2F5F7" font-size="26" font-weight="680">
        Исследователи
      </text>
      <text x="22" y="87" dominant-baseline="hanging"
            fill="#F2F5F7" font-size="26" font-weight="680">× N</text>
      <text x="22" y="124" dominant-baseline="hanging"
            fill="#8B98A5" font-size="18">поиск · загрузка</text>
    </g>

    <g transform="translate(620 180)">
      <rect width="240" height="160" rx="14" fill="#111A21"
            stroke="#2A3944" stroke-width="2"/>
      <text x="22" y="20" dominant-baseline="hanging"
            fill="#45D6A8" font-size="18" font-weight="700">
        03 / СОХРАНЕНИЕ
      </text>
      <text x="22" y="55" dominant-baseline="hanging"
            fill="#F2F5F7" font-size="26" font-weight="680">База</text>
      <text x="22" y="87" dominant-baseline="hanging"
            fill="#F2F5F7" font-size="26" font-weight="680">
        доказательств
      </text>
      <text x="22" y="124" dominant-baseline="hanging"
            fill="#8B98A5" font-size="18">снимок · цитата · вывод</text>
    </g>

    <g transform="translate(900 180)">
      <rect width="240" height="160" rx="14" fill="#111A21"
            stroke="#2A3944" stroke-width="2"/>
      <text x="22" y="20" dominant-baseline="hanging"
            fill="#45D6A8" font-size="18" font-weight="700">04 / ПРОВЕРКА</text>
      <text x="22" y="55" dominant-baseline="hanging"
            fill="#F2F5F7" font-size="26" font-weight="680">
        Проверяющие
      </text>
      <text x="22" y="87" dominant-baseline="hanging"
            fill="#F2F5F7" font-size="26" font-weight="680">× N</text>
      <text x="22" y="124" dominant-baseline="hanging"
            fill="#8B98A5" font-size="18">смысл · область · числа</text>
    </g>

    <g transform="translate(900 400)">
      <rect width="240" height="160" rx="14" fill="#111A21"
            stroke="#2A3944" stroke-width="2"/>
      <text x="22" y="20" dominant-baseline="hanging"
            fill="#45D6A8" font-size="18" font-weight="700">05 / СИНТЕЗ</text>
      <text x="22" y="72" dominant-baseline="hanging"
            fill="#F2F5F7" font-size="28" font-weight="680">
        Автор отчёта
      </text>
      <text x="22" y="124" dominant-baseline="hanging"
            fill="#8B98A5" font-size="18">только проверенные</text>
    </g>

    <g transform="translate(620 400)">
      <rect width="240" height="160" rx="14" fill="#111A21"
            stroke="#2A3944" stroke-width="2"/>
      <text x="22" y="20" dominant-baseline="hanging"
            fill="#F0B35A" font-size="18" font-weight="700">06 / РЕШЕНИЕ</text>
      <text x="22" y="55" dominant-baseline="hanging"
            fill="#F2F5F7" font-size="26" font-weight="680">Экспертная</text>
      <text x="22" y="87" dominant-baseline="hanging"
            fill="#F2F5F7" font-size="26" font-weight="680">проверка</text>
      <text x="22" y="124" dominant-baseline="hanging"
            fill="#8B98A5" font-size="18">принять · отклонить</text>
    </g>

    <g transform="translate(340 400)">
      <rect width="240" height="160" rx="14" fill="#15231F"
            stroke="#45D6A8" stroke-width="2"/>
      <text x="22" y="20" dominant-baseline="hanging"
            fill="#45D6A8" font-size="18" font-weight="700">07 / РЕЗУЛЬТАТ</text>
      <text x="22" y="55" dominant-baseline="hanging"
            fill="#F2F5F7" font-size="27" font-weight="680">Отчёт</text>
      <text x="22" y="87" dominant-baseline="hanging"
            fill="#F2F5F7" font-size="27" font-weight="680">с цитатами</text>
      <text x="22" y="124" dominant-baseline="hanging"
            fill="#8B98A5" font-size="18">Markdown · JSON · API</text>
    </g>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
     font-size="18" fill="#72818D">
    <circle cx="68" cy="602" r="4" fill="#45D6A8"/>
    <text x="82" y="590" dominant-baseline="hanging">контрольные точки</text>
    <circle cx="348" cy="602" r="4" fill="#45D6A8"/>
    <text x="362" y="590" dominant-baseline="hanging">повторы и восстановление</text>
    <circle cx="708" cy="602" r="4" fill="#45D6A8"/>
    <text x="722" y="590" dominant-baseline="hanging">изоляция данных</text>
    <circle cx="968" cy="602" r="4" fill="#45D6A8"/>
    <text x="982" y="590" dominant-baseline="hanging">телеметрия</text>
  </g>
</svg>
