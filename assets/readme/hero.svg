<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc">
  <title id="title">Deep Research Pipeline</title>
  <desc id="desc">
    Проверяемое исследование: от вопроса через неизменяемые источники и
    независимую проверку к отчёту с цитатами.
  </desc>

  <defs>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#45D6A8"/>
      <stop offset="1" stop-color="#8AE8C8"/>
    </linearGradient>
    <pattern id="ledger" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1B2730" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" rx="24" fill="#0B0F14"/>
  <rect width="1200" height="400" rx="24" fill="url(#ledger)" opacity=".55"/>

  <g transform="translate(64 54)">
    <text x="0" y="0" dominant-baseline="hanging"
          fill="#45D6A8" font-size="20" font-weight="700"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          letter-spacing="1.5">ИССЛЕДОВАНИЯ С ДОКАЗАТЕЛЬСТВАМИ</text>

    <text x="0" y="72" dominant-baseline="hanging"
          fill="#F2F5F7" font-size="70" font-weight="760"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
      Deep Research
    </text>
    <text x="0" y="146" dominant-baseline="hanging"
          fill="#F2F5F7" font-size="70" font-weight="760"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
      Pipeline
    </text>

    <text x="2" y="245" dominant-baseline="hanging"
          fill="#AAB5BF" font-size="26" font-weight="450"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
      Каждый вывод связан со снимком источника,
    </text>
    <text x="2" y="280" dominant-baseline="hanging"
          fill="#AAB5BF" font-size="26" font-weight="450"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
      точной цитатой и независимой проверкой.
    </text>
  </g>

  <g transform="translate(744 52)">
    <rect width="392" height="296" rx="18" fill="#101820"
          stroke="#2A3944" stroke-width="2"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="28" y="36" dominant-baseline="hanging"
            fill="#72818D" font-size="18">ПРОИСХОЖДЕНИЕ / ЗАПУСК</text>

      <g transform="translate(28 78)">
        <circle cx="10" cy="10" r="8" fill="#45D6A8"/>
        <text x="38" y="0" dominant-baseline="hanging"
              fill="#F2F5F7" font-size="22">СНИМОК ИСТОЧНИКА</text>
        <text x="38" y="32" dominant-baseline="hanging"
              fill="#72818D" font-size="18">sha256 · неизменяемый</text>
      </g>

      <path d="M38 106V154" stroke="url(#signal)" stroke-width="3"/>

      <g transform="translate(28 154)">
        <circle cx="10" cy="10" r="8" fill="#45D6A8"/>
        <text x="38" y="0" dominant-baseline="hanging"
              fill="#F2F5F7" font-size="22">ВЫВОД + ЦИТАТА</text>
        <text x="38" y="32" dominant-baseline="hanging"
              fill="#72818D" font-size="18">раздел · координаты</text>
      </g>

      <path d="M38 182V230" stroke="url(#signal)" stroke-width="3"/>

      <g transform="translate(28 230)">
        <circle cx="10" cy="10" r="8" fill="#45D6A8"/>
        <text x="38" y="0" dominant-baseline="hanging"
              fill="#F2F5F7" font-size="22">ПРОВЕРЕННЫЙ ОТЧЁТ</text>
        <text x="38" y="32" dominant-baseline="hanging"
              fill="#F0B35A" font-size="18">экспертное одобрение</text>
      </g>
    </g>
  </g>
</svg>
