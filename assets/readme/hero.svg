<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">Deep Research Pipeline</title>
  <desc id="desc">
    Self-hosted research pipeline, где каждый вывод проходит путь от
    неизменяемого снимка источника и точной цитаты до независимого verdict.
  </desc>

  <defs>
    <pattern id="coordinates" width="32" height="32"
             patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#20272C"
            stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="22" fill="#0A0D0F"/>
  <rect width="1200" height="420" rx="22" fill="url(#coordinates)"
        opacity=".46"/>
  <path d="M650 38V382" stroke="#30383E" stroke-width="1"/>

  <g id="title-block" transform="translate(58 48)">
    <text x="0" y="0" dominant-baseline="hanging"
          fill="#61D6B2" font-size="18" font-weight="700"
          letter-spacing="1.8"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      SELF-HOSTED · LANGGRAPH · EVIDENCE-FIRST
    </text>

    <text x="0" y="65" dominant-baseline="hanging"
          fill="#F4F1E8" font-size="68" font-weight="760"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
      Deep Research
    </text>
    <text x="0" y="136" dominant-baseline="hanging"
          fill="#F4F1E8" font-size="68" font-weight="760"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
      Pipeline
    </text>

    <text x="2" y="242" dominant-baseline="hanging"
          fill="#A6AFB5" font-size="24"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
      Исследование, где каждый вывод можно
    </text>
    <text x="2" y="276" dominant-baseline="hanging"
          fill="#A6AFB5" font-size="24"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
      проследить до источника и проверить.
    </text>

    <g transform="translate(0 334)"
       font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
       font-size="16" fill="#7F8B93">
      <text x="0" y="0">PYTHON 3.11+</text>
      <text x="150" y="0">POSTGRESQL</text>
      <text x="290" y="0">MULTI-PROVIDER LLM</text>
    </g>
  </g>

  <g id="evidence-contract" transform="translate(700 38)">
    <rect width="442" height="344" rx="16" fill="#111619"
          stroke="#394248" stroke-width="1.5"/>

    <text x="26" y="23" dominant-baseline="hanging"
          fill="#F4F1E8" font-size="20" font-weight="700"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      EVIDENCE CONTRACT
    </text>
    <circle cx="398" cy="34" r="6" fill="#61D6B2"/>
    <text x="26" y="53" dominant-baseline="hanging"
          fill="#7F8B93" font-size="16"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      SOURCE → QUOTE → CLAIM → VERDICT
    </text>

    <path d="M52 106V285" stroke="#465158" stroke-width="2"/>

    <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
      <g transform="translate(28 94)">
        <circle cx="24" cy="18" r="10" fill="#0A0D0F"
                stroke="#61D6B2" stroke-width="3"/>
        <text x="54" y="0" dominant-baseline="hanging"
              fill="#F4F1E8" font-size="21" font-weight="680">
          Source snapshot
        </text>
        <text x="54" y="29" dominant-baseline="hanging"
              fill="#7F8B93" font-size="18">
          URL · sha256 · byte size
        </text>
      </g>

      <g transform="translate(28 157)">
        <circle cx="24" cy="18" r="10" fill="#0A0D0F"
                stroke="#61D6B2" stroke-width="3"/>
        <text x="54" y="0" dominant-baseline="hanging"
              fill="#F4F1E8" font-size="21" font-weight="680">
          Exact quote
        </text>
        <text x="54" y="29" dominant-baseline="hanging"
              fill="#7F8B93" font-size="18">
          locator · start:end
        </text>
      </g>

      <g transform="translate(28 220)">
        <circle cx="24" cy="18" r="10" fill="#0A0D0F"
                stroke="#61D6B2" stroke-width="3"/>
        <text x="54" y="0" dominant-baseline="hanging"
              fill="#F4F1E8" font-size="21" font-weight="680">
          Claim
        </text>
        <text x="54" y="29" dominant-baseline="hanging"
              fill="#7F8B93" font-size="18">
          scope · numbers · citation
        </text>
      </g>

      <g transform="translate(28 283)">
        <circle cx="24" cy="18" r="10" fill="#61D6B2"/>
        <path d="M19 18L23 22L30 13" fill="none"
              stroke="#0A0D0F" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round"/>
        <text x="54" y="0" dominant-baseline="hanging"
              fill="#61D6B2" font-size="21" font-weight="720">
          Independent verdict
        </text>
        <text x="306" y="3" dominant-baseline="hanging"
              fill="#F0B45A" font-size="17" font-weight="700">
          HUMAN GATE
        </text>
      </g>
    </g>
  </g>
</svg>
