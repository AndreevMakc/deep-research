name: Quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: research
          POSTGRES_PASSWORD: research
          POSTGRES_DB: research
        ports:
          - 54321:5432
        options: >-
          --health-cmd "pg_isready -U research -d research"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: >-
        postgresql://research:research@localhost:54321/research

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Static analysis
        run: ruff check .

      - name: Apply migrations
        run: python -m app.db.migrate

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Database smoke tests
        run: |
          python -m tests.test_migrations_smoke
          python -m tests.test_source_claim_smoke
          python -m tests.test_verification_smoke
          python -m tests.test_partial_failure_smoke
          python -m tests.test_human_review_smoke
          python -m tests.test_observability_smoke
          python -m tests.test_api_smoke

      - name: Readiness and SLO checks
        run: |
          python -m app.health ready
          python -m app.health alerts --window-minutes 60

      - name: Offline quality thresholds
        run: >-
          python -m app.evaluation
          --output-root data/evaluations-ci

      - name: Build production image
        run: docker build -t deep-research:ci .
