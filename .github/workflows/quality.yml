name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: research
          POSTGRES_PASSWORD: research
          POSTGRES_DB: research
        ports:
          - 54321:5432
        options: >-
          --health-cmd "pg_isready -U research -d research"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: >-
        postgresql://research:research@localhost:54321/research
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: >-
          actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Python
        uses: >-
          actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate installed dependencies
        run: python -m pip check

      - name: Install browser for end-to-end tests
        run: python -m playwright install --with-deps chromium

      - name: Validate Python syntax
        run: python -m compileall -q app tests migrations

      - name: Lint
        run: ruff check .

      - name: Validate Docker Compose
        run: docker compose config -q

      - name: Apply and validate migrations
        run: |
          python -m app.db.migrate
          alembic check

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Readiness and SLO checks
        run: |
          python -m app.health ready
          python -m app.health alerts --window-minutes 60

      - name: Offline quality thresholds
        run: >-
          python -m app.evaluation
          --output-root data/evaluations-ci

      - name: Build image without publishing
        run: docker build -t deep-research:ci .
