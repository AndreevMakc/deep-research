services:
  app:
    build:
      context: .
    env_file:
      - .env
    environment:
      DATABASE_URL: >-
        postgresql://research:research@postgres:5432/research
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - research_artifacts:/app/data
    command:
      - python
      - -m
      - app.health
      - ready

  api:
    build:
      context: .
    env_file:
      - .env
    environment:
      DATABASE_URL: >-
        postgresql://research:research@postgres:5432/research
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - research_artifacts:/app/data
    ports:
      - "8000:8000"
    command:
      - uvicorn
      - app.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://localhost:8000/health/live',
          timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
    env_file:
      - .env
    environment:
      DATABASE_URL: >-
        postgresql://research:research@postgres:5432/research
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - research_artifacts:/app/data
    command:
      - python
      - -m
      - app.worker

  webhook-worker:
    build:
      context: .
    env_file:
      - .env
    environment:
      DATABASE_URL: >-
        postgresql://research:research@postgres:5432/research
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - python
      - -m
      - app.webhooks

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research
      POSTGRES_DB: research
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U research -d research
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  research_artifacts:
